<section class="content-card mini-card" [attr.aria-busy]="isLoading()">
  <div *ngIf="isLoading()" class="loading-overlay" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span>Carregando opções...</span>
  </div>

  <header class="card-header report-header">
    <span class="report-icon" aria-hidden="true">▧</span>
    <h1>Emissão de relatório</h1>
    <p>Selecione o período para gerar o PDF.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="gerar()" class="form-body report-form">
    <div class="field">
      <label for="report-table">Hidrômetro</label>
      <select id="report-table" formControlName="tabela">
        <option *ngFor="let t of tabelas()" [value]="t.tabela">{{ t.label }}</option>
      </select>
    </div>
    <div class="grid-2">
      <div class="field">
        <label for="datainicio">Data inicial</label>
        <input id="datainicio" type="date" formControlName="datainicio" />
      </div>
      <div class="field">
        <label for="datafinal">Data final</label>
        <input id="datafinal" type="date" formControlName="datafinal" />
      </div>
    </div>
    <button type="submit" class="primary-btn print-btn" [disabled]="form.invalid || isLoading()">
      Gerar relatório PDF
    </button>
  </form>
</section>
